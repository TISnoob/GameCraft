plugins { id 'fabric-loom' version '1.11-SNAPSHOT' }

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = "gamecraft-client-${project.minecraft_version}" }

loom {
    splitEnvironmentSourceSets()
    mods { gamecraft_client { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    dependsOn(":resource-packs:generateJavaPacks")
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = "UTF-8" }
